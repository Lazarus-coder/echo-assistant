<!doctype html>
<html lang="{{msg:locale}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{html:echoCompanion}}</title>
    <link rel="icon" href="/logo.svg" />
    <link rel="stylesheet" href="/style.css" />
    <style>
      body { background: var(--bg); }
      .mini { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100dvh; }
      .mini-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
      .mini-head b { font-size: 13.5px; }
      .mini-head .chip { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px; }
      .mini-thread { overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
      .mini-thread .msg.assistant .content { font-size: 14px; }
      .mini-feedback { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 0; margin: 6px 0 0; border: 0; }
      .mini-feedback button[aria-pressed="true"] { color: var(--accent); border-color: currentColor; }
      .mini-foot { padding: 0 12px 12px; }
      .mini-foot .composer { border-radius: 12px; }
      .mini-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 12px; }
    </style>
  </head>
  <body>
    <div class="mini">
      <div class="mini-head">
        <img src="/logo.svg" width="18" height="18" alt="" />
        <b id="topic">{{html:companion}}</b>
        <span class="chip" id="scenario">—</span>
        <span class="muted small right" id="model"></span>
      </div>
      <div class="mini-thread" id="thread" aria-label="{{html:chatMessages}}"><div class="mini-empty">{{html:connecting}}</div></div>
      <div class="mini-foot">
        <form id="composer" class="composer">
          <textarea id="input" rows="1" aria-label="{{html:message}}" placeholder="{{html:continueThisConversationEnterToSend}}"></textarea>
          <div class="composer-bar">
            <div class="composer-meta"><span class="muted" id="hint"></span></div>
            <div class="composer-actions">
              <button type="button" class="btn ghost small" data-act="open-main" disabled>{{html:openInMainWindow}}</button>
              <button type="submit" class="btn primary" id="send" disabled>{{html:send}}</button>
            </div>
          </div>
        </form>
      </div>
    </div>
    <script src="/mini.js" type="module"></script>
  </body>
</html>
