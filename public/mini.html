<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Echo · 伴随</title>
    <link rel="icon" href="/logo.svg" />
    <link rel="stylesheet" href="/style.css" />
    <style>
      body { background: var(--bg); }
      .mini { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100dvh; }
      .mini-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
      .mini-head b { font-size: 13.5px; }
      .mini-head .chip { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px; }
      .mini-thread { overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
      .mini-thread .msg.assistant .content { font-size: 14px; }
      .mini-foot { padding: 0 12px 12px; }
      .mini-foot .composer { border-radius: 12px; }
      .mini-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 12px; }
    </style>
  </head>
  <body>
    <div class="mini">
      <div class="mini-head">
        <img src="/logo.svg" width="18" height="18" alt="" />
        <b id="topic">伴随</b>
        <span class="chip" id="scenario">—</span>
        <span class="muted small right" id="model"></span>
      </div>
      <div class="mini-thread" id="thread" aria-label="对话消息"><div class="mini-empty">正在连接…</div></div>
      <div class="mini-foot">
        <form id="composer" class="composer">
          <textarea id="input" rows="1" aria-label="消息" placeholder="就这个话题问下去…（Enter 发送）"></textarea>
          <div class="composer-bar">
            <div class="composer-meta"><span class="muted" id="hint"></span></div>
            <div class="composer-actions">
              <button type="button" class="btn ghost small" data-act="open-main" disabled>在主窗口打开</button>
              <button type="submit" class="btn primary" id="send" disabled>发送</button>
            </div>
          </div>
        </form>
      </div>
    </div>
    <script src="/mini.js" type="module"></script>
  </body>
</html>
